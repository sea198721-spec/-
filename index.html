<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7fc"><title>Call Tracker</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#35354a;background:#f8f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px 14px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:4px 0 14px;font-size:27px}h2{font-size:19px}.muted{color:#77768a;font-size:13px}.tabs,.days{display:flex;gap:7px;overflow:auto;padding:6px 0 12px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 13px;background:#eae5f7;color:#55477c;font-weight:650}.tabs button.active,.days button.active{background:#8170ad;color:white}.panel,.item{background:white;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #27213a08}.item.ku{border-left:5px solid #9dcce7}.item.repeat{border-left:5px solid #f1d78b}.item.late{border-left:5px solid #e5a1a8}.item.soon{border-left:5px solid #efd68d}.item.ok{border-left:5px solid #b6dcc6}.item.urgent{background:#ffe0e3;border:1px solid #e998a3;border-left:6px solid #d94c61}.item.ku-orange{background:#fff0dc;border-left:6px solid #e89b36}.item.ku-red{background:#ffe1e4;border-left:6px solid #d94c61}.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.good{background:#dcf2e6;color:#286b4b}.warn{background:#fff0ca;color:#86631b}.bad{background:#fae1e4;color:#a44351}.primary{background:#dceaf9;color:#37658f}.tiny{font-size:12px;padding:7px 9px}label{display:block;font-size:13px;margin:12px 0 5px;color:#676478}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd9e7;border-radius:10px;background:#fff;color:#343449}textarea{min-height:88px;resize:vertical}.pill{font-size:12px;border-radius:9px;padding:5px 8px;background:#f0eafa;color:#735b9a}.empty{text-align:center;color:#8c889a;padding:35px 10px}.hide{display:none}.ku-slot{background:#edf6fc;border:1px dashed #b9d6e9;border-radius:12px;padding:11px;margin:8px 0;color:#5b86a6}.right{display:flex;gap:6px;align-items:center}.count{background:#e9e3f4;padding:5px 9px;border-radius:10px}.small{font-size:12px}details summary{cursor:pointer;color:#7965a4;margin-top:12px}footer{color:#8c8999;font-size:11px;margin-top:25px} @media print{body{background:white!important}body>*:not(#printArea){display:none!important}#printArea{display:block!important;font:14px Arial,sans-serif;color:#222}#printArea h1{font-size:23px}#printArea table{width:100%;border-collapse:collapse}#printArea th,#printArea td{border:1px solid #aaa;padding:9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}#printArea th{background:#eee}#printArea tr{break-inside:avoid}@page{size:A4;margin:15mm}}
</style></head><body><div class="wrap"><header><div><div class="muted">МОЙ РАБОЧИЙ ПОМОЩНИК</div><h1>Call Tracker</h1></div><button class="no-print" onclick="openAdd()">+ Добавить</button></header><nav class="tabs no-print"><button data-tab="calls" class="active" onclick="tab('calls')">Звонки</button><button data-tab="ku" onclick="tab('ku')">КУ звонки</button><button data-tab="visits" onclick="tab('visits')">Ожидаем в отделении</button></nav><main id="app"></main><footer>Данные хранятся только в этом браузере. Не вводите конфиденциальную банковскую информацию. При очистке данных браузера записи могут исчезнуть.</footer></div><section id="printArea" hidden></section><dialog id="modal" style="border:0;border-radius:18px;width:min(94vw,460px);padding:22px;box-shadow:0 15px 60px #2224"><form id="form"><h2>Добавить клиента</h2><label>Фамилия</label><input id="surname" maxlength="100" required autocomplete="off"><label>Категория</label><select id="category"><option value="КУ">КУ</option><option value="КЕШ">КЕШ</option><option value="Восстановление / другие">Восстановление / другие</option><option value="Привет">Привет</option></select><div id="dateWrap"><label>Закрыть звонок до (необязательно)</label><input type="date" id="due"></div><div class="actions"><button type="submit" class="good">Сохранить</button><button type="button" onclick="modal.close()">Отмена</button></div></form></dialog><script>
const KEY='calltracker_v1';let data=[];try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))data=x}catch(e){}let current='calls',day=(new Date().getDay()+6)%7;const names=['Понедельник','Вторник','Среда','Четверг','Пятница'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=()=>new Date().toLocaleDateString('sv-SE');const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function tab(t){current=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}function openAdd(){ $('form').reset();$('category').value=day===0?'КЕШ':day===1?'Восстановление / другие':day===2?'Привет':'КУ';$('dateWrap').style.display=$('category').value==='КУ'?'block':'none';$('modal').showModal()}$('category').onchange=()=>{$('dateWrap').style.display=$('category').value==='КУ'?'block':'none'};$('form').onsubmit=e=>{e.preventDefault();let cat=$('category').value;let obj={id:uid(),name:$('surname').value.trim(),category:cat,attempt:0,status:'active',created:iso(),notes:'',due:cat==='КУ'?$('due').value:'',day:cat==='КЕШ'?0:cat==='Восстановление / другие'?1:cat==='Привет'?2:Math.min(day,4)};if(!obj.name)return;data.push(obj);$('modal').close();save()};function act(id,action){let c=data.find(x=>x.id===id);if(!c)return;if(action==='visit'){c.status='visit'}else if(action==='arrived'||action==='reached'){data=data.filter(x=>x.id!==id)}else if(action==='retry'){c.attempt++;if(c.attempt>=3)data=data.filter(x=>x.id!==id)}save()}function update(id,field,val){let c=data.find(x=>x.id===id);if(!c)return;c[field]=val;localStorage.setItem(KEY,JSON.stringify(data))}function remove(id){if(confirm('Удалить контакт?')){data=data.filter(x=>x.id!==id);save()}}function sortKU(a,b){let ad=a.due||'9999',bd=b.due||'9999';return ad.localeCompare(bd)||a.name.localeCompare(b.name,'ru')}function card(c,urgent=false){let ku=c.category==='КУ',visit=c.status==='visit';let daysLeft=c.due?Math.round((new Date(c.due+'T00:00:00')-new Date(iso()+'T00:00:00'))/86400000):null;let late=ku&&daysLeft!==null&&daysLeft<=0,soon=ku&&daysLeft!==null&&daysLeft===1;let style=urgent?'urgent':ku&&daysLeft!==null&&daysLeft<=2?'ku-red':ku&&daysLeft===3?'ku-orange':ku?(late?'late':soon?'soon':'ku'):c.attempt?'repeat':'';let html=`<article class="item ${style}">${urgent?'<div style="font-weight:700;color:#b4233b;margin-bottom:8px">СРОЧНО · прозвонить</div>':''}<div class="line"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.category)}${!visit?' · Попыток: '+c.attempt+' из 3':''}</div></div>${ku&&c.due?`<span class="pill">До ${esc(c.due.split('-').reverse().join('.'))}</span>`:''}</div>`;if(ku){html+=`<details><summary>Комментарий и срок</summary><label>Комментарий (без конфиденциальных данных)</label><textarea oninput="update('${c.id}','notes',this.value)">${esc(c.notes)}</textarea><label>Закрыть звонок до</label><input type="date" value="${esc(c.due)}" onchange="update('${c.id}','due',this.value);render()"></details>`}if(visit){html+=`<div class="muted" style="white-space:pre-wrap;margin-top:8px">${esc(c.notes)}</div><div class="actions no-print"><button class="good" onclick="act('${c.id}','arrived')">Пришёл</button><button class="tiny bad" onclick="remove('${c.id}')">Удалить</button></div>`}else{html+=`<div class="actions no-print"><button class="good" onclick="act('${c.id}','reached')">Дозвон</button><button class="warn" onclick="act('${c.id}','retry')">Перенос попытки</button>${ku?`<button class="primary" onclick="act('${c.id}','visit')">Согласился прийти</button>`:''}<button class="tiny bad" onclick="remove('${c.id}')">×</button></div>`}return html+'</article>'}function render(){let el=$('app'),html='';if(current==='visits'){let list=data.filter(c=>c.status==='visit');html=`<div class="panel line"><div><h2>Ожидаем в отделении</h2><div class="muted">Клиентов: ${list.length}</div></div><button class="no-print" onclick="exportWord()">Скачать список Word</button></div>`+ (list.length?list.map(card).join(''):'<div class="empty">Пока нет ожидаемых посещений</div>')}else if(current==='ku'){let list=data.filter(c=>c.category==='КУ'&&c.status==='active'&&c.attempt>=1).sort(sortKU);html=`<div class="panel"><h2>КУ звонки</h2><div class="muted">Повторные попытки: ${list.length}</div></div>`+(list.length?list.map(card).join(''):'<div class="empty">Пока нет повторных звонков КУ</div>')}else{html='<div class="days">'+names.map((n,i)=>`<button class="${day===i?'active':''}" onclick="day=${i};render()">${n}</button>`).join('')+'</div>';let ku=data.filter(c=>c.category==='КУ'&&c.status==='active'&&c.attempt===0&&c.day===day);let regular=data.filter(c=>c.category!=='КУ'&&c.status==='active'&&(day<=2?c.day===day&&c.attempt===0:day===3?c.day<=2&&c.attempt<=1:day===4&&c.day<=2&&c.attempt<=2));if(day>=3)regular.sort((a,b)=>a.attempt-b.attempt||a.day-b.day||a.name.localeCompare(b.name,'ru'));html+=`<div class="panel"><h2>${names[day]}</h2><div class="muted">${day===0?'Новые звонки КЕШ':day===1?'Новые звонки Восстановление / другие':day===2?'Новые звонки Привет':day===3?'Вторая попытка дозвона':'Третья попытка дозвона'}</div></div><h2>Новые КУ сегодня</h2>`;for(let i=0;i<3;i++)html+=ku[i]?card(ku[i]):`<div class="ku-slot">КУ · свободное место ${i+1}</div>`;if(ku.length>3)html+='<div class="muted">Дополнительные новые КУ</div>'+ku.slice(3).map(card).join('');html+='<h2>'+(day===3||day===4?'Срочные и повторные звонки':'Основной список')+'</h2>'+(regular.length?regular.map(c=>card(c,day===3?c.attempt===0:day===4?c.attempt<2:false)).join(''):'<div class="empty">Нет звонков на этот день</div>')}el.innerHTML=html}
function exportWord(){
 const list=data.filter(c=>c.status==='visit');
 const xmlEscape=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const para=(v,bold=false)=>'<w:p><w:r>'+(bold?'<w:rPr><w:b/></w:rPr>':'')+'<w:t xml:space="preserve">'+xmlEscape(v)+'</w:t></w:r></w:p>';
 const cell=v=>'<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr>'+String(v).split(/\r?\n/).map(t=>para(t)).join('')+'</w:tc>';
 const row=a=>'<w:tr>'+a.map(cell).join('')+'</w:tr>';
 const table='<w:tbl><w:tblPr><w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(x=>'<w:'+x+' w:val="single" w:sz="5" w:color="C6C6C6"/>').join('')+'</w:tblBorders></w:tblPr>'+row(['№','Фамилия','Комментарий'])+list.map((c,i)=>row([i+1,c.name,c.notes||''])).join('')+'</w:tbl>';
 const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+para('Ожидаем в отделении',true)+para('Дата формирования: '+new Date().toLocaleDateString('ru-RU')+' · Клиентов: '+list.length)+table+'<w:sectPr/></w:body></w:document>';
 const files=[
 ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
 ['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
 ['word/document.xml',documentXml]
 ];
 const enc=new TextEncoder(),chunks=[],central=[];let offset=0;
 const u16=(v)=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
 function crc32(bytes){let c=0xFFFFFFFF;for(let b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return(c^0xFFFFFFFF)>>>0}
 function add(arr){let a=new Uint8Array(arr);chunks.push(a);offset+=a.length}
 for(const [name,content] of files){
   let n=enc.encode(name),d=enc.encode(content),crc=crc32(d),start=offset;
   add([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...n]);
   add(d);
   central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(start),...n]));
 }
 let centralStart=offset;for(let c of central)add(c);
 add([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(offset-centralStart),...u32(centralStart),...u16(0)]);
 let blob=new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
 let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ожидаем_в_отделении_'+iso()+'.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function printVisits(){let list=data.filter(c=>c.status==='visit');let rows=list.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td style="white-space:pre-wrap">${esc(c.notes)}</td></tr>`).join('');$('printArea').innerHTML=`<h1>Ожидаем в отделении</h1><p>Дата формирования: ${new Date().toLocaleDateString('ru-RU')} · Клиентов: ${list.length}</p><table><thead><tr><th>№</th><th>Фамилия</th><th>Комментарий</th></tr></thead><tbody>${rows}</tbody></table>`;window.print()}render();</script></body></html>
