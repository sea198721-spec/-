<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7fc"><title>Call Tracker</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#35354a;background:#f8f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px 14px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:4px 0 14px;font-size:27px}h2{font-size:19px}.muted{color:#77768a;font-size:13px}.tabs,.days{display:flex;gap:7px;overflow:auto;padding:6px 0 12px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 13px;background:#eae5f7;color:#55477c;font-weight:650}.tabs button.active,.days button.active{background:#8170ad;color:white}.panel,.item{background:white;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #27213a08}.item.ku{border-left:5px solid #9dcce7}.item.repeat{border-left:5px solid #f1d78b}.item.late{border-left:5px solid #e5a1a8}.item.soon{border-left:5px solid #efd68d}.item.ok{border-left:5px solid #b6dcc6}.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.good{background:#dcf2e6;color:#286b4b}.warn{background:#fff0ca;color:#86631b}.bad{background:#fae1e4;color:#a44351}.primary{background:#dceaf9;color:#37658f}.tiny{font-size:12px;padding:7px 9px}label{display:block;font-size:13px;margin:12px 0 5px;color:#676478}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd9e7;border-radius:10px;background:#fff;color:#343449}textarea{min-height:88px;resize:vertical}.pill{font-size:12px;border-radius:9px;padding:5px 8px;background:#f0eafa;color:#735b9a}.empty{text-align:center;color:#8c889a;padding:35px 10px}.hide{display:none}.ku-slot{background:#edf6fc;border:1px dashed #b9d6e9;border-radius:12px;padding:11px;margin:8px 0;color:#5b86a6}.right{display:flex;gap:6px;align-items:center}.count{background:#e9e3f4;padding:5px 9px;border-radius:10px}.small{font-size:12px}details summary{cursor:pointer;color:#7965a4;margin-top:12px}footer{color:#8c8999;font-size:11px;margin-top:25px} @media print{header,.tabs,.days,.actions,.no-print,footer{display:none!important}body{background:white}.wrap{max-width:none}.panel,.item{box-shadow:none;border:1px solid #ddd;break-inside:avoid}textarea{border:0}}
</style></head><body><div class="wrap"><header><div><div class="muted">МОЙ РАБОЧИЙ ПОМОЩНИК</div><h1>Call Tracker</h1></div><button class="no-print" onclick="openAdd()">+ Добавить</button></header><nav class="tabs no-print"><button data-tab="calls" class="active" onclick="tab('calls')">Звонки</button><button data-tab="ku" onclick="tab('ku')">КУ звонки</button><button data-tab="visits" onclick="tab('visits')">Ожидаем в отделении</button></nav><main id="app"></main><footer>Данные хранятся только в этом браузере. Не вводите конфиденциальную банковскую информацию. При очистке данных браузера записи могут исчезнуть.</footer></div><dialog id="modal" style="border:0;border-radius:18px;width:min(94vw,460px);padding:22px;box-shadow:0 15px 60px #2224"><form id="form"><h2>Добавить клиента</h2><label>Фамилия</label><input id="surname" maxlength="100" required autocomplete="off"><label>Категория</label><select id="category"><option value="КУ">КУ</option><option value="КЕШ">КЕШ</option><option value="Восстановление / другие">Восстановление / другие</option><option value="Привет">Привет</option></select><div id="dateWrap"><label>Закрыть звонок до (необязательно)</label><input type="date" id="due"></div><div class="actions"><button type="submit" class="good">Сохранить</button><button type="button" onclick="modal.close()">Отмена</button></div></form></dialog><script>
const KEY='calltracker_v1';let data=[];try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))data=x}catch(e){}let current='calls',day=(new Date().getDay()+6)%7;const names=['Понедельник','Вторник','Среда','Четверг','Пятница'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=()=>new Date().toLocaleDateString('sv-SE');const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function tab(t){current=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}function openAdd(){ $('form').reset();$('dateWrap').style.display='block';$('modal').showModal()}$('category').onchange=()=>{$('dateWrap').style.display=$('category').value==='КУ'?'block':'none'};$('form').onsubmit=e=>{e.preventDefault();let cat=$('category').value;let obj={id:uid(),name:$('surname').value.trim(),category:cat,attempt:0,status:'active',created:iso(),notes:'',due:cat==='КУ'?$('due').value:'',day:cat==='КЕШ'?0:cat==='Восстановление / другие'?1:cat==='Привет'?2:Math.min(day,4)};if(!obj.name)return;data.push(obj);$('modal').close();save()};function act(id,action){let c=data.find(x=>x.id===id);if(!c)return;if(action==='visit'){c.status='visit'}else if(action==='arrived'||action==='reached'){data=data.filter(x=>x.id!==id)}else if(action==='retry'){c.attempt++;if(c.attempt>=3)data=data.filter(x=>x.id!==id)}save()}function update(id,field,val){let c=data.find(x=>x.id===id);if(!c)return;c[field]=val;localStorage.setItem(KEY,JSON.stringify(data))}function remove(id){if(confirm('Удалить контакт?')){data=data.filter(x=>x.id!==id);save()}}function sortKU(a,b){let ad=a.due||'9999',bd=b.due||'9999';return ad.localeCompare(bd)||a.name.localeCompare(b.name,'ru')}function card(c){let ku=c.category==='КУ',visit=c.status==='visit',late=ku&&c.due&&c.due<=iso(),soon=ku&&c.due&&new Date(c.due+'T00:00:00')-new Date(iso()+'T00:00:00')<=86400000;let style=ku?(late?'late':soon?'soon':'ku'):c.attempt?'repeat':'';let html=`<article class="item ${style}"><div class="line"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.category)}${!visit?' · Попыток: '+c.attempt+' из 3':''}</div></div>${ku&&c.due?`<span class="pill">До ${esc(c.due.split('-').reverse().join('.'))}</span>`:''}</div>`;if(ku){html+=`<details><summary>Комментарий и срок</summary><label>Комментарий (без конфиденциальных данных)</label><textarea oninput="update('${c.id}','notes',this.value)">${esc(c.notes)}</textarea><label>Закрыть звонок до</label><input type="date" value="${esc(c.due)}" onchange="update('${c.id}','due',this.value);render()"></details>`}if(visit){html+=`<div class="muted" style="white-space:pre-wrap;margin-top:8px">${esc(c.notes)}</div><div class="actions no-print"><button class="good" onclick="act('${c.id}','arrived')">Пришёл</button><button class="tiny bad" onclick="remove('${c.id}')">Удалить</button></div>`}else{html+=`<div class="actions no-print"><button class="good" onclick="act('${c.id}','reached')">Дозвон</button><button class="warn" onclick="act('${c.id}','retry')">Перенос попытки</button>${ku?`<button class="primary" onclick="act('${c.id}','visit')">Согласился прийти</button>`:''}<button class="tiny bad" onclick="remove('${c.id}')">×</button></div>`}return html+'</article>'}function render(){let el=$('app'),html='';if(current==='visits'){let list=data.filter(c=>c.status==='visit');html=`<div class="panel line"><div><h2>Ожидаем в отделении</h2><div class="muted">Клиентов: ${list.length}</div></div><button class="no-print" onclick="printVisits()">Сохранить в PDF</button></div>`+ (list.length?list.map(card).join(''):'<div class="empty">Пока нет ожидаемых посещений</div>')}else if(current==='ku'){let list=data.filter(c=>c.category==='КУ'&&c.status==='active'&&c.attempt>=1).sort(sortKU);html=`<div class="panel"><h2>КУ звонки</h2><div class="muted">Повторные попытки: ${list.length}</div></div>`+(list.length?list.map(card).join(''):'<div class="empty">Пока нет повторных звонков КУ</div>')}else{html='<div class="days">'+names.map((n,i)=>`<button class="${day===i?'active':''}" onclick="day=${i};render()">${n}</button>`).join('')+'</div>';let ku=data.filter(c=>c.category==='КУ'&&c.status==='active'&&c.attempt===0&&c.day===day);let regular=data.filter(c=>c.category!=='КУ'&&c.status==='active'&&(day<=2?c.day===day&&c.attempt===0:day===3?c.attempt===1:day===4&&c.attempt===2));html+=`<div class="panel"><h2>${names[day]}</h2><div class="muted">${day===0?'Новые звонки КЕШ':day===1?'Новые звонки Восстановление / другие':day===2?'Новые звонки Привет':day===3?'Вторая попытка дозвона':'Третья попытка дозвона'}</div></div><h2>Новые КУ · первые 3 места</h2>`;for(let i=0;i<3;i++)html+=ku[i]?card(ku[i]):`<div class="ku-slot">КУ · свободное место ${i+1}</div>`;if(ku.length>3)html+='<div class="muted">Дополнительные новые КУ</div>'+ku.slice(3).map(card).join('');html+='<h2>Основной список</h2>'+(regular.length?regular.map(card).join(''):'<div class="empty">Нет звонков на этот день</div>')}el.innerHTML=html}function printVisits(){let list=data.filter(c=>c.status==='visit');let rows=list.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td style="white-space:pre-wrap">${esc(c.notes)}</td></tr>`).join('');let w=window.open('','_blank');if(!w){alert('Разрешите всплывающие окна для экспорта PDF');return}w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Ожидаем в отделении</title><style>body{font:14px Arial,sans-serif;padding:20px;color:#222}h1{font-size:23px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:10px;text-align:left;vertical-align:top}th{background:#eee}@page{size:A4;margin:15mm}</style></head><body><h1>Ожидаем в отделении</h1><p>Дата формирования: ${new Date().toLocaleDateString('ru-RU')} · Клиентов: ${list.length}</p><table><thead><tr><th>№</th><th>Фамилия</th><th>Комментарий</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}render();</script></body></html>
